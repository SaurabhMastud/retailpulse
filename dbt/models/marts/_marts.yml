version: 2

models:
  - name: daily_revenue
    description: One row per calendar date with purchase counts, distinct purchasing users, and gross revenue.
    columns:
      - name: event_date
        tests:
          - unique
          - not_null
      - name: gross_revenue
        tests:
          - not_null

  - name: funnel_conversion
    description: >
      One row per session start date -- page_view -> add_to_cart -> purchase
      session counts and stage-to-stage conversion rates for that day. Sessions
      are attributed to the date of their first event.
    columns:
      - name: session_date
        tests:
          - unique
          - not_null
      - name: total_sessions
        tests:
          - not_null
      - name: sessions_with_page_view
        tests:
          - not_null

  - name: top_products
    description: >
      One row per (event_date, product_id) with purchase counts, units sold and
      gross revenue. Daily grain so any window can be rolled up downstream.
      product_category is joined from the products seed rather than taken from
      the event, so the catalog is the single source of truth for it. The
      composite key is asserted by tests/assert_top_products_grain_is_unique.sql
      and events agreeing with the catalog by
      tests/assert_event_category_matches_products.sql.
    columns:
      - name: event_date
        tests:
          - not_null
      - name: product_id
        tests:
          - not_null
      - name: gross_revenue
        tests:
          - not_null
