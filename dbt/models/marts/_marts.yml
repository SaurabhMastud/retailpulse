version: 2

models:
  - name: daily_revenue
    description: One row per calendar date with purchase counts, distinct purchasing users, and gross revenue.
    columns:
      - name: event_date
        tests:
          - unique
          - not_null
      - name: gross_revenue
        tests:
          - not_null

  - name: funnel_conversion
    description: Single-row funnel over all sessions to date -- page_view -> add_to_cart -> purchase counts and stage-to-stage conversion rates.
    columns:
      - name: total_sessions
        tests:
          - not_null
      - name: sessions_with_page_view
        tests:
          - not_null
