version: 2

models:
  - name: daily_revenue
    description: One row per calendar date with purchase counts, distinct purchasing users, and gross revenue.
    columns:
      - name: event_date
        tests:
          - unique
          - not_null
      - name: gross_revenue
        tests:
          - not_null

  - name: funnel_conversion
    description: >
      One row per session start date -- page_view -> add_to_cart -> purchase
      session counts and stage-to-stage conversion rates for that day. Sessions
      are attributed to the date of their first event.
    columns:
      - name: session_date
        tests:
          - unique
          - not_null
      - name: total_sessions
        tests:
          - not_null
      - name: sessions_with_page_view
        tests:
          - not_null

  - name: top_products
    description: One row per product_id with purchase counts, units sold, and gross revenue, ranked by revenue. Assumes a product_id always maps to the same product_category -- enforced by the unique test below.
    columns:
      - name: product_id
        tests:
          - unique
          - not_null
      - name: gross_revenue
        tests:
          - not_null
