version: 2

sources:
  - name: raw
    schema: main
    tables:
      - name: raw_events
      - name: quarantined_events
      - name: pipeline_runs

models:
  - name: stg_events
    description: Typed, renamed view over raw_events (one row per event; event_id is unique because ingestion upserts on it).
    columns:
      - name: event_id
        tests:
          - unique
          - not_null
      - name: event_type
        tests:
          - not_null
          - accepted_values:
              values: ['page_view', 'add_to_cart', 'purchase']
      - name: user_id
        tests:
          - not_null
      - name: session_id
        tests:
          - not_null

  - name: stg_quarantined_events
    description: Typed, renamed view over quarantined_events (invalid events rejected by ingestion, kept for inspection/replay). event_id may be null -- a missing event_id is itself one of the rejection reasons.
    columns:
      - name: error
        tests:
          - not_null
      - name: quarantined_at
        tests:
          - not_null

  - name: stg_pipeline_runs
    description: >
      One row per ingest, with row counts and a derived reject_rate. Batch ids
      repeat when a run is retried -- an idempotent retry shows up as a second
      row with duplicates equal to events_read, which is the intended shape,
      so batch_id is deliberately not unique-tested.
    columns:
      - name: batch_id
        tests:
          - not_null
      - name: events_read
        tests:
          - not_null
      - name: ingested_at
        tests:
          - not_null
