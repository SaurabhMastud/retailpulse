retailpulse:
  target: dev
  outputs:
    dev:
      type: duckdb
      # Overridable so a test (or a throwaway backfill) can build the models
      # into a scratch warehouse instead of the working one.
      path: "{{ env_var('RETAILPULSE_WAREHOUSE', '../data/warehouse/retailpulse.duckdb') }}"
      threads: 4
